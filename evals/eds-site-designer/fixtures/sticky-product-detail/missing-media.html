<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky product detail — missing media fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="section">
      <div class="product-detail">
        <div class="product-detail__gallery"><p>No media was authored. A production fallback must not preserve this empty gallery machinery.</p></div>
        <div class="product-detail__details">
          <header class="product-detail__identity"><p>Field instrument 07</p><h1>Observer One</h1></header>
          <div class="product-detail__purchase"><p><strong>$1,240</strong></p><a href="#purchase">Reserve instrument</a></div>
          <div class="product-detail__description"><h2>Overview</h2><p>Meaningful product content must remain prominent when media is absent.</p></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
